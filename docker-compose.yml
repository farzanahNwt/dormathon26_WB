version: '3.8'

services:
  laici-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laici-agent-core
    restart: unless-stopped
    ports:
      - "80:5000"
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
    env_file:
      - backend/.env
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/uploads:/app/backend/uploads
